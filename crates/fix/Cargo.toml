[package]
name = "fix"
version = "0.1.0"
edition = "2021"
publish = false
description = "FIX protocol implementation for RustForge trading connectivity"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# "macros" is required by the `tokio::select!` in session.rs. Without it this
# crate only compiles inside the workspace, because a sibling crate pulls
# tokio with "full" and Cargo unifies features across the build — so
# `cargo test -p fix` failed while `cargo check --workspace` passed.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
chrono = "0.4"
thiserror = "1.0"
