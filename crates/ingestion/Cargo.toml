[package]
name = "ingestion"
version = "0.1.0"
edition = "2021"
publish = false
description = "Market data ingestion and real-time feed processing for RustForge"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
common = { path = "../common" }

# Async
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"

# WebSocket
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# String types
compact_str = { version = "0.8", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Databento live market data. Optional: the client pulls its own TLS stack and
# the DBN decoder, and a build that never touches Databento should not carry
# them. Enable with `--features databento`.
# `default-features = false, features = ["live"]` is load-bearing, not tidiness.
# The default set enables `historical`, which pulls reqwest + zstd and turns on
# `reqwest/default-tls` -> native-tls -> OpenSSL, and it flips rustls's crypto
# backend from ring to aws-lc-rs, which needs cmake and a C toolchain. deny.toml
# bans openssl and cmake precisely to keep the build pure Rust, and enabling the
# defaults broke both. Live-only keeps the existing TLS stack untouched — and
# this source does not make historical requests anyway, by design.
databento = { version = "0.59", default-features = false, features = ["live"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# Logging
tracing = "0.1"

# HTTP client (for news feed)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["test-util"] }

[features]
default = []
databento = ["dep:databento", "dep:tokio-stream"]

[[example]]
name = "databento_probe"
# Without this a default `cargo test --workspace` tries to build the example
# with the databento dependency absent, and fails.
required-features = ["databento"]
